<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่ 3 มิติ โรงเรียนธัญรัตน์ (ลานจอดรถ ถนน คลอง) — งานแข่งขันหุ่นยนต์และคอมพิวเตอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a37;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fb;--accent:#ff6a00;--comp:#c8f56e;--class:#a8e4b4;--dome:#fff08a;--wc:#5fe0e6;--reg:#e53935}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Sarabun',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:grid;grid-template-columns:1fr 390px;height:100%}
#scene{position:relative;overflow:hidden;background:linear-gradient(#e3eef8,#f3f6f0)}
#scene canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{pointer-events:auto;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:800;font-size:15px;line-height:1.35;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:opacity .25s,transform .15s;user-select:none}
.lbl:hover{transform:scale(1.08)}
.lbl.comp{background:var(--comp)}
.lbl.dome{background:var(--dome)}
.lbl.small{font-size:11px;font-weight:600;padding:0 7px;border-width:1px;background:#e6fbfc;cursor:default}
.lbl.reg{background:var(--reg);color:#fff;border-color:#8e1b1b;font-size:13px}
.lbl.gate{background:var(--ink);color:#fff;font-size:12px;cursor:default}
.lbl.flag{font-size:11px;font-weight:600;border-width:1px;cursor:default}
.lbl.dim{opacity:.25}
.labels.nolbl .lbl:not(.sel){display:none}
.lbl.sel{background:var(--accent);color:#fff;border-color:#9a3c00}
#title{position:absolute;left:16px;top:14px;pointer-events:none;display:flex;align-items:center;gap:10px}
#emblem{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#title h1{margin:0;font-size:22px;font-weight:800;text-shadow:0 1px 0 #fff}
#title p{margin:0;font-size:14px;color:var(--muted);font-weight:600}
#tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#tools button{font:inherit;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:left}
#tools button.on{background:var(--ink);color:#fff}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;display:grid;grid-template-columns:auto auto;gap:4px 14px}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.35);display:inline-block}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(31,42,55,.85);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#panel{background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:16px 18px 30px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:12px;position:sticky;top:-16px;z-index:2}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:15px;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
h3.grp{font-size:13px;letter-spacing:.3px;color:var(--muted);margin:16px 0 6px;font-weight:700}
.evt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.evt>i{flex:0 0 12px;height:12px;border-radius:3px;margin-top:6px;border:1px solid rgba(0,0,0,.3)}
.evt b{font-size:15.5px;display:block;line-height:1.35}
.spots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.spots button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer}
.spots button:hover{border-color:var(--accent);color:var(--accent)}
.spots button em{font-style:normal;color:var(--muted)}
.bitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.bitem:hover{border-color:var(--accent)}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:999px;border:2px solid var(--ink);font-weight:800;background:var(--class)}
.num.comp{background:var(--comp)}.num.dome{background:var(--dome)}
.bitem small{display:block;color:var(--muted);font-size:13px}
.back{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:8px}
.bhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.bhead h2{margin:0;font-size:22px}
.bhead small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.floors{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.floor{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.floor b{min-width:44px}
.floor span{font-size:14.5px}
.floor.has{background:#f4fde4;border-color:#b9e27a}
.floor.has span{font-weight:700}
.floor.plain span{color:var(--ink)}
.floor.none span{color:#a0aab8}
.floor.on{background:var(--accent);border-color:var(--accent);color:#fff}
.floor.on span{color:#fff}
.floor .go{margin-left:auto;font-size:12px;opacity:.75}
.plan-wrap h4{margin:6px 0 6px;font-size:16px}
svg.plan{width:100%;height:auto;background:#fff;border-radius:8px}
svg.plan text{text-anchor:middle;dominant-baseline:central;font-family:'Sarabun',sans-serif;font-weight:700;fill:#1f2a37;pointer-events:none}
svg.plan .room rect{stroke:#1f2a37;stroke-width:1.5}
svg.plan .room.ghost rect{stroke:#cbd5e1;stroke-dasharray:3 3}
svg.plan .room.ghost text{fill:#94a3b8;font-weight:600}
svg.plan .room.ev{cursor:pointer}
svg.plan .room.ev:hover rect{filter:brightness(.93)}
svg.plan .room.active rect{stroke:var(--accent);stroke-width:6;stroke-dasharray:none;animation:pulse 1.2s ease-in-out infinite}
svg.plan .note{fill:#94a3b8;font-weight:600}
svg.plan text.t2{font-weight:600;fill:#475569}
@keyframes pulse{50%{stroke-opacity:.35}}
.tip{font-size:13px;color:var(--muted);margin:6px 0}
.detail{margin-top:10px;border-radius:12px;padding:10px 12px;background:var(--bg);border-left:6px solid var(--accent);font-size:15px;display:none}
.detail.show{display:block}
.detail small{display:block;color:var(--muted);font-size:13px}
.intro{font-size:14px;color:var(--muted);margin:0 0 4px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr 46%}
  #panel{border-left:0;border-top:1px solid var(--line);padding:12px 14px 24px}
  #title h1{font-size:16px}#title p{font-size:12px}
  #emblem{width:38px;height:38px}
  #legend{display:none}
  #tools{flex-direction:row;top:auto;bottom:10px;right:10px}
  #tools span{display:none}
  #tools button{font-size:17px;padding:4px 10px}
  #hint{display:none}
  .lbl{font-size:12px;padding:0 7px}
  .lbl.small,.lbl.flag{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="title"><img id="emblem" alt="ตราโรงเรียนธัญรัตน์"><div><h1>แผนที่ 3 มิติ โรงเรียนธัญรัตน์</h1><p>งานแข่งขันหุ่นยนต์และคอมพิวเตอร์</p></div></div>
    <div id="tools">
      <button data-view="home">⟲<span> มุมเริ่มต้น</span></button>
      <button data-view="top">⬒<span> มองจากด้านบน</span></button>
      <button data-view="labels" id="lblBtn">#<span> ซ่อนป้ายตัวเลข</span></button>
      <button data-view="roof" id="roofBtn">⌂<span> ซ่อนหลังคาโดม/โรงยิม</span></button>
      <button data-view="spin" id="spinBtn">↻<span> หมุนอัตโนมัติ</span></button>
    </div>
    <div id="legend">
      <span><i style="background:var(--comp)"></i>อาคารแข่งขัน</span>
      <span><i style="background:var(--class)"></i>อาคารเรียน</span>
      <span><i style="background:var(--dome)"></i>โดมอเนกประสงค์</span>
      <span><i style="background:var(--wc)"></i>ห้องน้ำ</span>
      <span><i style="background:var(--reg);border-radius:50%"></i>จุดลงทะเบียน</span>
      <span><i style="background:var(--accent)"></i>ชั้นที่เลือก</span>
    </div>
    <div id="hint">ลากเพื่อหมุน • ล้อเมาส์หรือสองนิ้วเพื่อซูม • แตะอาคารเพื่อดูรายละเอียด</div>
  </div>
  <aside id="panel"></aside>
</div>

/* ===== ผังห้องตามแผนผังโรงเรียน ปีการศึกษา 2566 ===== */
// cell = [ชื่อห้อง, บรรทัดที่สอง, น้ำหนักความกว้าง, ชนิด]  ชนิด: 's' บันได, 'w' ห้องน้ำ, 'o' ห้องอื่น, (ว่าง) ห้องเรียน
const CLS_FILL = '#eaf7ee', OTH_FILL = '#f6f1e4';
function evText(t, t2){ return /^\d+\/\d+$/.test(t2||'') ? `ห้อง ${t} · ห้องเรียน ม.${t2}` : (t2 ? `${t} · ${t2}` : t); }
function cellRoom(c, x, y, w, h, key){
  const [t, t2, , k] = c;
  if (k === 's') return {id:key, t:t || 'บันได', x, y, w, h, ghost:1};
  if (k === 'w') return {id:key, t:t || 'ห้องน้ำ', x, y, w, h, fill:'#dff6f7'};
  return {id:t, t, t2, x, y, w, h, fill: k === 'o' ? OTH_FILL : CLS_FILL, ev: evText(t, t2)};
}
function hplan(cells, corTop, W=680){
  const tot = cells.reduce((a, c) => a + (c[2] || 1), 0), y = corTop ? 44 : 4, rooms = [];
  let x = 4; const unit = (W - 8)/tot;
  cells.forEach((c, i) => { const w = (c[2] || 1)*unit; rooms.push(cellRoom(c, x+1, y, w-2, 112, 'c'+i)); x += w; });
  return {w:W, h:160, fs:22, rooms, notes:[{t:'ระเบียงทางเดิน', x:W/2, y:corTop ? 21 : 139}]};
}
function vplan2(west, east, W=362, H=504){   // สองแถว ทางเดินกลาง (อาคาร 6)
  const rooms = [], cw = 122;
  for (const [col, x] of [[west, 5], [east, W-5-cw]]){
    const tot = col.reduce((a, c) => a + (c[2] || 1), 0), unit = (H - 10)/tot; let y = 5;
    col.forEach((c, i) => { const h = (c[2] || 1)*unit; rooms.push(cellRoom(c, x, y+1, cw, h-2, (x < W/2 ? 'w' : 'e')+i)); y += h; });
  }
  return {w:W, h:H, fs:18, rooms, notes:[{t:'ทางเดิน', x:W/2, y:H/2, rot:1}]};

function courtMat(wM, dM){
  const W = 1024, H = Math.round(W*dM/wM), c = document.createElement('canvas'); c.width = W; c.height = H;

  for (const sx of [ox, ox+cw]){ const dir = sx === ox ? 1 : -1;

  const r = def.parts[0], Y0 = .1, fh = FH, n = def.floors;
  const {g, add, plane, L, Dp, box} = partGroup(def, all, r, 'e');
  const LIME = '#b4e766', LIME2 = '#97d84a', PALE = '#d3f0a6', BRICK = '#a9573f', zF = Dp/2;
  add(box(L, .2, Dp), '#d6d9d2', 0, Y0+.1, 0, 1);
  const bd = Dp*.55; add(floorBox(L, fh, bd), LIME, 0, Y0+fh/2, -Dp/2+bd/2, 1, {map:TEX});
  const bays = Math.round(L/5), bay = L/bays;
  for (let i = 0; i <= bays; i++) for (const z of [zF-.4, 0]) add(box(.7, fh, .7), LIME2, -L/2+i*bay, Y0+fh/2, z, 1);
  for (let f = 2; f <= n; f++){
    const y = Y0 + (f-1)*fh;
    add(floorBox(L, fh-.06, Dp), LIME, 0, y+(fh-.06)/2, 0, f, {map:TEX});
    add(box(L+.5, .32, Dp+.5), LIME2, 0, y+.16, 0, f);
  }
  // ห้องประชุมชั้น 3 : แผงครีบระแนงขาว + ป้ายชื่อ
  const hW = L*.58, hY = Y0 + 2*fh, hH = fh*1.35;
  add(box(hW, hH, 1.4), PALE, 0, hY+hH/2, zF+.7, 3);
  for (let x = -hW/2+.6; x <= hW/2-.5; x += .85) add(box(.22, fh*1.05, .5), '#f7f8f4', x, hY+.15+fh*.525, zF+1.65, 3);
  const sign = textPlane('อาคารกาญจนาภิเษก', hW*.6, 1.05, null, '#24402a');
  sign.position.set(hW*.12, hY+hH-.55, zF+1.42); Object.assign(sign.userData, {bid:def.id, floor:3}); g.add(sign); all.push(sign);
  const smallE = new THREE.Mesh(new THREE.CircleGeometry(.55, 32), emblemMat()); smallE.position.set(-hW*.24, hY+hH-.55, zF+1.43);
  smallE.userData = {bid:def.id, floor:3}; g.add(smallE); all.push(smallE);
  // ผนังอิฐแดงสองข้าง + ช่องลม
  for (const sx of [-1, 1]){
    add(box(3.6, 3*fh, .45), BRICK, sx*(hW/2+2.4), Y0+fh+1.5*fh, zF+.22, 3);
    plane(new THREE.PlaneGeometry(4, 2.2), ventMat(PALE, '#7e9a5c', [6, 3]), sx*(hW/2+6.5), Y0+fh+fh*.6, zF+.02, 2);
  }
  // หลังคาแบน + โครงคานด้านบน
  const top = Y0 + n*fh;
  add(box(L+.8, .7, Dp+.8), LIME2, 0, top+.35, 0, n+1);
  for (const sx of [-1, 1]) for (const k of [-.35, 0, .35]) add(box(.5, 2.6, .5), LIME, k*L, top+2, sx*(Dp/2-1.5), n+1);
  for (const k of [-.35, 0, .35]) add(box(.45, .45, Dp-2), LIME, k*L, top+3.3, 0, n+1);
  for (const sx of [-1, 1]) add(box(L*.75, .45, .45), LIME, 0, top+3.3, sx*(Dp/2-1.5), n+1);
  return top + 3.6;
}

/* ---------- อาคาร 8-1 ตึกสูงสีเขียวมิ้นต์ ---------- */
function buildTower8(def, all){
  const Y0 = .1, fh = FH, n = def.floors;
  const {g, add, box, L, Dp} = partGroup(def, all, def.parts[0], 'w');
  const MINT = '#c6ebd8', M2 = '#a7d9c0';
  for (let f = 1; f <= n; f++){
    const y = Y0 + (f-1)*fh;
    add(floorBox(L, fh-.06, Dp), MINT, 0, y+(fh-.06)/2, 0, f, {map:TEX});
    if (f > 1) add(box(L+.5, .3, Dp+.5), M2, 0, y+.15, 0, f);
    for (const sx of [-1, 1]) add(box(.8, fh, .8), M2, sx*(L/2-.2), y+fh/2, Dp/2+.1, f);
  }
  const top = Y0 + n*fh;
  add(box(L+.5, 1.3, Dp+.5), M2, 0, top+.65, 0, n+1);
  add(box(6, 3, 5), MINT, L/2-4, top+1.5, -Dp/4, n+1);
  add(box(6.4, .3, 5.4), M2, L/2-4, top+3.1, -Dp/4, n+1);
  return top + 3.3;
}
/* ---------- อาคาร 8-2, 8-3 อาคารชั้นเดียวหลังคาจั่ว ---------- */
function buildHall(def, all){
  const Y0 = .1, H = def.fh;
  const {g, add, box, L, Dp} = partGroup(def, all, def.parts[0], 's');
  const WALL = '#d3efe3', LOW = '#8fc9a0';
  add(box(L, 1.3, Dp), LOW, 0, Y0+.65, 0, 1);
  add(floorBox(L, H-1.3, Dp), WALL, 0, Y0+1.3+(H-1.3)/2, 0, 1, {map:TEX});
  const rh = Dp*.42, rf = gableRoof(L, Dp, rh, '#6f6b68', 1);
  rf.position.y = Y0 + H; rf.castShadow = true; rf.userData = {bid:def.id, floor:2}; g.add(rf); PICK.push(rf); all.push(rf);
  // หน้าจั่วยกสูงสองข้าง
  for (const sx of [-1, 1]){
    const sh = new THREE.Shape(); sh.moveTo(-Dp/2, 0); sh.lineTo(Dp/2, 0); sh.lineTo(Dp*.12, rh+1.2); sh.lineTo(-Dp*.12, rh+1.2); sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, {depth:.5, bevelEnabled:false}); geo.translate(0, 0, -.25); geo.rotateY(Math.PI/2);
    add(geo, WALL, sx*(L/2-.2), Y0+H, 0, 2);
  }
  // ทางเดินมีหลังคาด้านหน้า
  add(box(L, .18, 2.6), '#b9bfc4', 0, Y0+3, Dp/2+1.3, 1);
  for (let x = -L/2+.5; x <= L/2; x += 4.5) add(box(.25, 3, .25), '#e6ebe8', x, Y0+1.5, Dp/2+2.4, 1);
  return Y0 + H + rh + 1.2;
}
function makeBuilding(def){
  const fh = def.fh || FH, n = def.floors, all = [];
  const base = new THREE.Color(def.color || KIND[def.kind]);
  let roofTop;
  if (def.custom === 'b6') roofTop = buildB6(def, all);
  else if (def.custom === 'b1') roofTop = buildB1(def, all);
  else if (def.custom === 'gym') roofTop = buildGym(def, all);
  else if (def.custom === 'dome') roofTop = buildDome(def, all);
  else if (def.custom === 'corr') roofTop = buildCorridor(def, all);
  else if (def.custom === 'b5') roofTop = buildB5(def, all);
  else if (def.custom === 'tower8') roofTop = buildTower8(def, all);
  else if (def.custom === 'hall') roofTop = buildHall(def, all);
  else {
  for (let i = 0; i < n; i++){
    for (const r of def.parts){
      const w=(r[2]-r[0])*S, d=(r[3]-r[1])*S, cx=px((r[0]+r[2])/2), cz=pz((r[1]+r[3])/2);
      const m = new THREE.Mesh(floorBox(w, fh-.06, d), mat(base.clone(), {map:TEX}));
      m.position.set(cx, i*fh + (fh-.06)/2 + .1, cz); m.castShadow = m.receiveShadow = true;
      m.userData = {bid:def.id, floor:i+1, base:base.clone()};
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({color:0x334155, transparent:true, opacity:.35}));
      e.position.copy(m.position); e.userData = {bid:def.id, floor:i+1};
      scene.add(m, e); PICK.push(m); all.push(m, e);
    }
  }
  const top = n*fh + .1; roofTop = top;
  for (const r of def.parts){
    const w=(r[2]-r[0])*S, d=(r[3]-r[1])*S, cx=px((r[0]+r[2])/2), cz=pz((r[1]+r[3])/2);
    let m;
    if (def.roof === 'gable'){ const h = Math.min(w,d)*.28; m = gableRoof(w, d, h, def.roofC || '#8d98a5'); roofTop = Math.max(roofTop, top+h); }
    else if (def.roof === 'arch'){ m = archRoof(w, d, def.flat || .4, def.kind === 'dome' ? '#d9dde2' : '#b7c0c9'); roofTop = Math.max(roofTop, top + (Math.min(w,d)/2)*(def.flat||.4)); }
    else { m = new THREE.Mesh(new THREE.BoxGeometry(w+.5, .6, d+.5), mat('#a3acb6')); m.position.y = .3; roofTop = Math.max(roofTop, top+.6); }
    m.position.x = cx; m.position.z = cz; m.position.y += top; m.castShadow = true;
    m.userData = {bid:def.id, floor:n+1};
    scene.add(m); PICK.push(m); all.push(m);
  }
  }
  const r0 = def.labelAt || def.parts[0];
  const lp = new THREE.Vector3(px((r0[0]+r0[2])/2), roofTop + 4, pz((r0[1]+r0[3])/2));
  const lb = label(def.label || def.id, def.kind === 'comp' ? 'comp' : def.kind === 'dome' ? 'dome' : '', lp, () => select(def.id));
  B[def.id] = {def, all, label:lb, fh, top:roofTop};
}

      const g = new THREE.Group();
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.8, .75, 4.3), new THREE.MeshStandardMaterial({color:C[(ri*3+k) % C.length], roughness:.35, metalness:.4})); b.position.y = .55; b.castShadow = true;
      const t = new THREE.Mesh(new THREE.BoxGeometry(1.6, .6, 2.2), new THREE.MeshStandardMaterial({color:'#2a3440'})); t.position.set(0, 1.2, -.2);
      g.add(b, t); scene.add(g); cars.push({g, segs, tot, off: k*tot/ro.n + ri*7, v: 6 + (k%2)});
    }
  });
  const t0 = performance.now();
  (function go(now){
    const t = (now - t0)/1000;
    for (const c of cars){
      let d = (t*c.v + c.off) % c.tot;
      for (const [a, b, l] of c.segs){ if (d <= l){ c.g.position.lerpVectors(a, b, d/l); c.g.rotation.y = Math.atan2(b.x - a.x, b.z - a.z); break; } d -= l; }
    }
    requestAnimationFrame(go);
  })(t0);
})();

// หมุดจุดลงทะเบียน
const regPos = new THREE.Vector3(px(928.5), B['6'].top + .1, pz(458));
(function(){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3, 16), mat('#e53935', {transparent:false})); cone.rotation.x = Math.PI; cone.position.y = 1.5;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1.4, 20, 16), mat('#e53935', {transparent:false})); ball.position.y = 3.6;
  g.add(cone, ball); g.position.copy(regPos); scene.add(g);
  label('จุดลงทะเบียน', 'reg', regPos.clone().add(new THREE.Vector3(0, 8, 0)), () => select('6', 1, 'reg1'));
  regPin = g;
})();
var regPin;
label('ทางเข้าโรงเรียน', 'gate', new THREE.Vector3(px(972), 1.5, pz(590)));

// หมุดตำแหน่งห้อง
const pin = new THREE.Group();
{
  const m = mat('#ff6a00', {transparent:false, emissive:'#7a2c00'});
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.9, 2.6, 16), m); cone.rotation.x = Math.PI; cone.position.y = 1.3;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1.15, 20, 16), m); ball.position.y = 3.2;
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.4, 2.1, 32), new THREE.MeshBasicMaterial({color:'#ff6a00', transparent:true, opacity:.6, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.y = .05; pin.userData.ring = ring;
  pin.add(cone, ball, ring); pin.visible = false; scene.add(pin);
}

/* ================= การเลือก / ไฮไลต์ ================= */
let roofHidden = false;
let sel = {b:null, f:null, room:null}, hover = null, tab = 'ev';
function setOp(o, op){
  o.material.opacity = o.isLineSegments ? op * .35 : op;
  o.material.depthWrite = op > .99;
  o.visible = op > .01 && !(o.userData.hideable && roofHidden);
}
function applyState(){
  for (const id in B){
    const b = B[id], isSel = sel.b === id, dim = sel.b && !isSel;
    for (const o of b.all){
      const f = o.userData.floor; let op = 1, hl = false;
      if (dim) op = sel.f ? .16 : .45;
      else if (isSel && sel.f){ if (f > sel.f) op = .07; else if (f === sel.f) hl = true; }
      setOp(o, op);
      if (o.isMesh && o.material.emissive){
        if (o.userData.base) o.material.color.copy(hl ? HL : o.userData.base);
        o.material.emissive.setHex(hl ? 0x4a1d00 : (hover === id || (isSel && !sel.f)) ? 0x262626 : 0);
      }
    }
    b.label.element.classList.toggle('dim', !!dim);
    b.label.element.classList.toggle('sel', isSel);
  }
  renderer.domElement.style.cursor = hover ? 'pointer' : 'grab';
}
function updatePin(){
  pin.visible = false;
  if (!sel.b || !sel.f || !sel.room) return;
  const b = B[sel.b], inf = b.def.info?.[sel.f], plan = inf && PLANS[inf.plan];
  if (!plan) return;
  const r = plan.rooms.find(q => q.id === sel.room); if (!r) return;
  const ps = b.def.parts, p = [Math.min(...ps.map(q=>q[0])), Math.min(...ps.map(q=>q[1])), Math.max(...ps.map(q=>q[2])), Math.max(...ps.map(q=>q[3]))];
  const u = (r.x + r.w/2)/plan.w, v = (r.y + r.h/2)/plan.h;
  pin.position.set(px(p[0] + u*(p[2]-p[0])), (b.def.pinGround ? .3 : sel.f*b.fh + .25), pz(p[1] + v*(p[3]-p[1])));
  pin.visible = true;
}

// กล้อง
const HOME = {t:new THREE.Vector3(0,0,70), r:330, phi:.92, th:-.42};
let anim = null;
function flyTo(target, r, phi, th){
  const fromT = controls.target.clone(), fromP = camera.position.clone();
  const cur = new THREE.Spherical().setFromVector3(fromP.clone().sub(fromT));
  let t2 = th ?? cur.theta;
  while (t2 - cur.theta > Math.PI) t2 -= Math.PI*2;
  while (cur.theta - t2 > Math.PI) t2 += Math.PI*2;
  anim = {t0:performance.now(), dur:1000, fromT, toT:target.clone(), s0:cur, s1:new THREE.Spherical(r, phi ?? cur.phi, t2)};
}
const aspectK = () => Math.max(1, 1.35 / camera.aspect);
function flyHome(){ flyTo(HOME.t, HOME.r*aspectK(), HOME.phi, HOME.th); }
function flyToBuilding(id, f){
  const b = B[id], ps = b.def.parts;
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  ps.forEach(r => { x0=Math.min(x0,px(r[0])); x1=Math.max(x1,px(r[2])); z0=Math.min(z0,pz(r[1])); z1=Math.max(z1,pz(r[3])); });
  const size = Math.max(x1-x0, z1-z0, 30);
  const y = f ? (f-.5)*b.fh : b.top/2;
  flyTo(new THREE.Vector3((x0+x1)/2, y, (z0+z1)/2), (size*2.5 + 45)*(b.def.zoom||1)*aspectK(), f ? .8 : .9, b.def.th);
}
function select(id, f=null, room=null, fly=true){
  sel = {b:id, f, room};
  applyState(); updatePin(); renderPanel();
  if (fly){ id ? flyToBuilding(id, f) : flyHome(); }
  stopSpin();
}

// คลิก / โฮเวอร์
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const rc = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(PICK, false).find(h => h.object.visible && h.object.material.opacity > .15);
  return hit ? hit.object.userData : null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; hideHint(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  if (Math.hypot(e.clientX-down.x, e.clientY-down.y) < 6){
    const h = pick(e);
    if (h){
      const b = B[h.bid];
      if (sel.b === h.bid && h.floor <= b.def.floors) select(h.bid, sel.f === h.floor ? null : h.floor);
      else if (sel.b !== h.bid) select(h.bid);
    }
  }
  down = null;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  const h = pick(e), id = h ? h.bid : null;
  if (id !== hover){ hover = id; applyState(); }
});

// ปุ่มมุมมอง
let spinning = false;
const spinBtn = document.getElementById('spinBtn');
function stopSpin(){ spinning = false; controls.autoRotate = false; spinBtn.classList.remove('on'); }
document.getElementById('tools').addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.view; if (!v) return;
  if (v === 'home'){ select(null); }
  if (v === 'top'){ stopSpin(); flyTo(sel.b ? controls.target : new THREE.Vector3(0,0,30), sel.b ? 120 : 260, .02, 0); }
  if (v === 'labels'){
    const off = labelR.domElement.classList.toggle('nolbl');
    const btn = document.getElementById('lblBtn');
    btn.classList.toggle('on', off);
    btn.querySelector('span').textContent = off ? ' แสดงป้ายตัวเลข' : ' ซ่อนป้ายตัวเลข';
  }
  if (v === 'roof'){
    roofHidden = !roofHidden;
    const btn = document.getElementById('roofBtn');
    btn.classList.toggle('on', roofHidden);
    btn.querySelector('span').textContent = roofHidden ? ' แสดงหลังคาโดม/โรงยิม' : ' ซ่อนหลังคาโดม/โรงยิม';
    applyState();
  }
  if (v === 'spin'){ spinning = !spinning; controls.autoRotate = spinning; controls.autoRotateSpeed = 1.2; spinBtn.classList.toggle('on', spinning); }
});
const hint = document.getElementById('hint');
function hideHint(){ hint.style.opacity = 0; }
setTimeout(hideHint, 7000);

/* ================= แผงข้อมูล ================= */
const panel = document.getElementById('panel'); let lastB = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const numCls = d => d.kind === 'comp' ? 'comp' : d.kind === 'dome' ? 'dome' : '';

function planSVG(key, active){
  const p = PLANS[key];
  let s = `<svg class="plan" viewBox="-6 -6 ${p.w+12} ${p.h+12}" data-plan="${key}"${p.h > p.w*1.6 ? ' style="max-width:190px;display:block;margin:0 auto"' : ''}>`;
  s += `<rect x="0" y="0" width="${p.w}" height="${p.h}" fill="#fbfcfe" stroke="#1f2a37" stroke-width="2.5"/>`;
  for (const r of p.rooms){
    const cls = ['room']; if (r.ev) cls.push('ev'); if (r.ghost) cls.push('ghost'); if (r.id === active) cls.push('active');
    const len = [...r.t.replace(/[ัิ-ฺ็-๎]/g,'')].length;
    const along = r.rot ? r.h : r.w, across = r.rot ? r.w : r.h;
    const fs = Math.min(p.fs, along/(len*.62+.8), across*.5);
    const cx = r.x + r.w/2, cy = r.ty ?? (r.y + r.h/2);
    s += `<g class="${cls.join(' ')}" data-id="${r.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3" fill="${r.ghost ? '#fff' : (r.fill || '#fff')}"${r.dash ? ' stroke-dasharray="7 4"' : ''}/>`;
    if (r.t2 && !r.rot){
      const f2 = Math.min(fs*.8, r.w/([...r.t2].length*.62+.8));
      s += `<text x="${cx}" y="${cy - fs*.42}" font-size="${fs.toFixed(1)}">${esc(r.t)}</text><text class="t2" x="${cx}" y="${cy + fs*.62}" font-size="${f2.toFixed(1)}">${esc(r.t2)}</text></g>`;
    } else s += `<text x="${cx}" y="${cy}" font-size="${fs.toFixed(1)}"${r.rot ? ` transform="rotate(-90 ${cx} ${cy})"` : ''}>${esc(r.t)}</text></g>`;
  }
  for (const n of (p.notes || [])) s += `<text class="note" x="${n.x}" y="${n.y}" font-size="${p.fs*.8}"${n.rot ? ` transform="rotate(-90 ${n.x} ${n.y})"` : ''}>${esc(n.t)}</text>`;
  return s + '</svg>';
}

function homeHTML(){
  let h = `<div class="tabs"><button data-tab="ev" class="${tab==='ev'?'on':''}">รายการแข่งขัน</button><button data-tab="bd" class="${tab==='bd'?'on':''}">อาคาร</button></div>`;
  if (tab === 'ev'){
    h += `<p class="intro">แตะชื่อสนามหรือห้อง แผนที่จะพาไปยังอาคาร ชั้น และห้องนั้น</p>`;
    for (const grp of EVENTS){
      h += `<h3 class="grp">${esc(grp.g)}</h3>`;
      for (const it of grp.items){
        h += `<div class="evt"><i style="background:${it.c}"></i><div><b>${esc(it.n)}</b><div class="spots">`;
        for (const [t,b,f,room] of it.s) h += `<button data-go="${b}|${f}|${room||''}">${esc(t)}</button>`;
        h += `</div></div></div>`;
      }
    }
  } else {
    const list = [...DEFS].sort((a,b) => (b.info?1:0) - (a.info?1:0));
    for (const d of list){
      const acts = d.info ? Object.entries(d.info).map(([f,i]) => `ชั้น ${f}: ${i.t}`).join(' • ') : `${d.floors} ชั้น`;
      h += `<button class="bitem" data-b="${d.id}"><span class="num ${numCls(d)}">${esc(d.label || d.id)}</span><span><b>${esc(d.name)}</b>${d.sub ? ` <span style="color:var(--muted)">(${esc(d.sub)})</span>` : ''}<small>${esc(acts)}</small></span></button>`;
    }
  }
  return h;
}

function buildingHTML(){
  const b = B[sel.b], d = b.def;
  let h = `<button class="back">← กลับไปหน้ารายการ</button>`;
  h += `<div class="bhead"><span class="num ${numCls(d)}">${esc(d.label || d.id)}</span><div><h2>${esc(d.name)}</h2>${d.sub ? `<small>${esc(d.sub)}</small>` : ''}</div></div>`;
  h += `<div class="floors">`;
  for (let f = d.floors; f >= 1; f--){
    const inf = d.info?.[f];
    const cls = ['floor', inf ? (inf.plain ? 'plain' : 'has') : 'none', sel.f === f ? 'on' : ''].join(' ');
    h += `<button class="${cls}" data-f="${f}"><b>${d.floors === 1 ? 'ทั้งหลัง' : 'ชั้น ' + f}</b><span>${inf ? esc(inf.t) : '—'}</span>${inf?.plan ? '<span class="go">ผังห้อง ›</span>' : ''}</button>`;
  }
  h += `</div>`;
  const inf = sel.f && d.info?.[sel.f];
  if (inf?.plan){
    h += `<div class="plan-wrap"><h4>ผัง${d.name} ชั้น ${sel.f}</h4>${planSVG(inf.plan, sel.room)}<p class="tip">แตะห้องที่มีสีเพื่อดูรายละเอียด</p><div class="detail" id="detail"></div></div>`;
  } else if (!sel.f){
    h += `<p class="tip">เลือกชั้นเพื่อไฮไลต์ในแผนที่ ${d.info ? 'ชั้นที่มีพื้นสีเขียวคือชั้นที่มีกิจกรรม' : ''}</p>`;
  }
  return h;
}

function showDetail(){
  const el = document.getElementById('detail'); if (!el) return;
  const d = B[sel.b].def, inf = d.info?.[sel.f], r = sel.room && PLANS[inf.plan].rooms.find(q => q.id === sel.room);
  if (!r || !r.ev){ el.classList.remove('show'); return; }
  el.innerHTML = `<b>${esc(r.ev)}</b><small>${esc(d.name)} ชั้น ${sel.f} · ${esc(r.t)}</small>`;
  el.style.borderLeftColor = r.fill || 'var(--accent)';
  el.classList.add('show');
}

function renderPanel(){
  const keep = (sel.b && sel.b === lastB) ? panel.scrollTop : null; lastB = sel.b;
  panel.innerHTML = sel.b ? buildingHTML() : homeHTML();
  if (sel.b){
    showDetail();
    const plan = panel.querySelector('.plan-wrap');
    if (plan && sel.f && panel.clientHeight < 560) plan.scrollIntoView({block:'start'}); else if (keep !== null && sel.f) panel.scrollTop = keep; else panel.scrollTop = 0;
  } else panel.scrollTop = 0;
}

panel.addEventListener('click', e => {
  const t = e.target.closest('button, g.room');
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; renderPanel(); return; }
  if (t.classList.contains('back')){ select(null); return; }
  if (t.dataset.go){ const [b,f,room] = t.dataset.go.split('|'); select(b, +f, room || null); return; }
  if (t.dataset.b){ select(t.dataset.b); return; }
  if (t.dataset.f){ const f = +t.dataset.f; select(sel.b, sel.f === f ? null : f, null); return; }
  if (t.matches('g.room.ev')){
    sel.room = t.dataset.id;
    panel.querySelectorAll('g.room').forEach(g => g.classList.toggle('active', g.dataset.id === sel.room));
    updatePin(); showDetail();
  }
});

/* ================= เริ่มทำงาน ================= */
function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();
controls.target.copy(HOME.t);
camera.position.copy(HOME.t).add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(HOME.r*1.5, .55, HOME.th - .8)));
flyHome();
applyState(); renderPanel();
document.fonts?.ready.then(() => { TEXT_PLANES.forEach(m => m.userData.redraw()); SCREEN_MATS.forEach(m => m.userData.redraw()); LATE_TEX.forEach(t => t.userData.draw()); });

window.__map = {camera, controls, THREE};
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
renderer.setAnimationLoop(now => {
  if (anim){
    const k = Math.min(1, (now - anim.t0)/anim.dur), e = ease(k);
    controls.target.lerpVectors(anim.fromT, anim.toT, e);
    const s = new THREE.Spherical(
      anim.s0.radius + (anim.s1.radius - anim.s0.radius)*e,
      anim.s0.phi + (anim.s1.phi - anim.s0.phi)*e,
      anim.s0.theta + (anim.s1.theta - anim.s0.theta)*e);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
    if (k >= 1) anim = null;
  }
  const t = now/1000;
  if (pin.visible){ pin.children[0].position.y = 1.3 + Math.sin(t*4)*.4; pin.children[1].position.y = 3.2 + Math.sin(t*4)*.4; const sc = 1 + (t*1.5 % 1)*1.2; pin.userData.ring.scale.set(sc,sc,sc); pin.userData.ring.material.opacity = .7*(1-(t*1.5%1)); }
  if (regPin) regPin.position.y = regPos.y + Math.sin(t*3)*.5;
  controls.update();
  renderer.render(scene, camera); labelR.render(scene, camera);
});
</script>
